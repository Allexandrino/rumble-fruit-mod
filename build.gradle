plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'info.solidsoft.pitest' version '1.15.0'
    id 'jacoco'
}

version = '1.0.0'
group = 'com.rumblefruit'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // GeckoLib (animations)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup("software.bernie.geckolib") }
    }
    // Lithostitched (data-driven worldgen), via Modrinth maven
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup("maven.modrinth") }
    }
}

neoForge {
    version = '21.1.250'

    mods {
        rumblefruit {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'rumblefruit'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5.1"
    implementation "maven.modrinth:lithostitched:1.7.13-neoforge-21.1"
    // player attack/skill animations (Better Combat / Emotecraft stack)
    implementation "maven.modrinth:playeranimator:2.0.4+1.21.1-forge"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    testLogging { events 'PASSED', 'FAILED', 'SKIPPED' }
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

// mutation testing: ./gradlew pitest (mutates the pure core package)
pitest {
    targetClasses = ['com.rumblefruit.core.*', 'com.rumblefruit.OrbManager', 'com.rumblefruit.ReleaseSkill']
    targetTests = ['com.rumblefruit.core.*Test', 'com.rumblefruit.*Test']
    junit5PluginVersion = '1.2.1'
    threads = 4
    outputFormats = ['HTML', 'XML']
    exportLineCoverage = true
    mutators = ['DEFAULTS']
    verbose = true
    avoidCallsTo = ['java.util.logging']
}

jar {
    manifest.attributes([
            "MixinConfigs": "rumblefruit.mixins.json"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
